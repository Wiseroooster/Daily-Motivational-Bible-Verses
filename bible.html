<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Path of Faith - Complete Bible</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 20px; background: #121212; color: #fff; text-align: center; }
        .controls { margin: 20px auto; max-width: 600px; display: flex; gap: 10px; justify-content: center; }
        select { padding: 10px; border-radius: 6px; background: #222; color: #fff; border: 1px solid #444; font-size: 1rem; cursor: pointer; }
        .reader-container { max-width: 700px; margin: 30px auto; padding: 30px; border-radius: 12px; background: #1e1e1e; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: left; }
        .bible-title { font-size: 1.8rem; font-weight: bold; margin-bottom: 20px; border-bottom: 2px solid #333; padding-bottom: 10px; color: #fff; text-align: center;}
        .text-content { font-size: 1.3rem; line-height: 1.8; color: #e0e0e0; }
        .attribution { font-size: 0.85rem; color: #888; font-style: italic; border-top: 1px solid #333; padding-top: 15px; margin-top: 30px; text-align: center; }
    </style>
</head>
<body>

    <h1>Path of Faith Bible</h1>

    <!-- 1. The selection elements -->
    <div class="controls">
        <select id="book-select">
            <option value="GEN">Genesis</option>
            <option value="EXO">Exodus</option>
            <option value="MAT">Matthew</option>
            <option value="JHN">John</option>
        </select>
        <select id="chapter-select">
            <option value="1">Chapter 1</option>
        </select>
    </div>

    <!-- 2. This exact structure gives the script a safe container to place data -->
    <div class="reader-container">
        <div id="display-title" class="bible-title">Genesis 1</div>
        <div id="bible-text" class="text-content">Connecting securely to YouVersion...</div>
        <div id="bible-copyright" class="attribution"></div>
    </div>

    <!-- 3. Load the official YouVersion Global Delivery Engine Bundle -->
    <script src="https://unpkg.com"></script>
    
    <script>
        async function loadBibleChapter() {
            const bookCode = document.getElementById("book-select").value || "GEN";
            const chapterNum = document.getElementById("chapter-select").value || "1";
            
            // Format the reference to query a specific chapter block
            const targetUSFMReference = `${bookCode}.${chapterNum}`;

            try {
                // Initialize the structural connection client mapping
                const apiClient = new YouVersionPlatform.ApiClient({ 
                    appKey: "L6XK5ehCZDGT0gmb5xjAUm2Ul1rqPpOLxkIGmIceVTo0RO6k" 
                });
                const bibleClient = new YouVersionPlatform.BibleClient(apiClient);

                // Fetch data payloads for NIV identifier code 3034
                const passage = await bibleClient.getPassage(3034, targetUSFMReference, "text");
                const version = await bibleClient.getVersion(3034);

                // Inject the raw values safely into your container framework targets
                document.getElementById('bible-text').innerText = passage.content || "Text compilation empty.";
                document.getElementById('bible-copyright').innerText = version.copyright || "";
                
            } catch (error) {
                console.error("Connection Error Data:", error);
                document.getElementById('bible-text').innerText = "Unable to fetch content. Verify that your portal website path matches your exact domain address.";
            }
        }

        // Initialize setup elements when layout framework mounts completely
        window.onload = loadBibleChapter;
        document.getElementById("book-select").addEventListener("change", loadBibleChapter);
        document.getElementById("chapter-select").addEventListener("change", loadBibleChapter);
    </script>
</body>
</html>
