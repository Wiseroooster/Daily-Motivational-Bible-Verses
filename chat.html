<!-- ChatApp Embed Code -->
<iframe
  id="chat-widget"
  src="https://8080-app-3adeb4ee-e380-4147-beca-8bf7ce14ed46-pchcjhua2cz08fi1.zite-sandbox.com/embed"
  style="width:100%;height:600px;border:none;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.12);"
  allow="clipboard-write"
  title="Chat Widget">
</iframe>
<script>
  (function() {
    var iframe = document.getElementById("chat-widget");
    var origin = window.location.origin;
    var target = "https://8080-app-3adeb4ee-e380-4147-beca-8bf7ce14ed46-pchcjhua2cz08fi1.zite-sandbox.com";
    function sendOrigin() {
      try { iframe.contentWindow.postMessage({ type: "CHAT_ORIGIN", origin: origin }, target); } catch(e) {}
    }
    iframe.addEventListener("load", function() {
      sendOrigin();
      setTimeout(sendOrigin, 500);
      setTimeout(sendOrigin, 1500);
    });
  })();
</script>
