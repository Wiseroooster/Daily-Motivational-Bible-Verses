<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Path of Faith - Settings</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .settings-box {
            text-align: left;
            margin-top: 20px;
        }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        /* Toggle Switch Styling */
        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 22px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255,255,255,0.2);
            transition: .3s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: "";
            height: 14px; width: 14px;
            left: 4px; bottom: 4px;
            background-color: white;
            transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--gold); }
        input:checked + .slider:before { transform: translateX(24px); }
    </style>
</head>
<body>
    <div id="bg-canvas"></div>
    <canvas id="particle-overlay"></canvas>

    <nav id="mainNav">
        <div class="logo-container">
            <div class="logo-circle">†</div>
            <span class="logo-text">PATH OF FAITH</span>
        </div>
        <div class="nav-links">
            <a href="index.html">Daily</a>
            <a href="explore.html">Explore</a>
            <a href="settings.html" class="active-link">Settings</a>
        </div>
    </nav>

    <div class="container" style="cursor: default; max-width: 450px;">
        <h1>Settings</h1>
        <div class="settings-box">
            <div class="setting-row">
                <span>Particle Atmosphere</span>
                <label class="switch">
                    <input type="checkbox" id="particleToggle">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-row">
                <span>Auto-Copy Verse</span>
                <label class="switch">
                    <input type="checkbox" id="copyToggle">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-row">
                <span>High Contrast Mode</span>
                <label class="switch">
                    <input type="checkbox" id="contrastToggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
